<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">eShark — comparação de ofertas com decisão transparente</title><desc id="desc">Três ofertas passam por uma leitura de critérios e formam uma recomendação com sinal de proteção.</desc>
